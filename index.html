<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#31616;&#26131;&#25918;&#32622; RPG</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="createPanel" class="create-panel">
        <div class="create-box">
          <h1>&#31616;&#26131;&#25918;&#32622; RPG</h1>
          <label>
            &#35282;&#33394;&#21517;
            <input id="characterName" type="text" maxlength="12" value="&#20882;&#38505;&#32773;" />
          </label>
          <div class="class-options" id="classOptions"></div>
          <button id="createCharacterBtn" type="button">&#21019;&#24314;&#35282;&#33394;</button>
          <p id="moduleWarning" class="module-warning hidden">
            JavaScript &#27169;&#22359;&#26410;&#21152;&#36733;&#12290;&#35831;&#36890;&#36807;&#26412;&#22320;&#26381;&#21153;&#22120;&#25171;&#24320;&#27492;&#39029;&#38754;&#12290;
          </p>
        </div>
      </section>

      <section id="gamePanel" class="game-panel hidden">
        <header class="topbar">
          <div>
            <h1 id="playerName">-</h1>
            <p id="playerMeta">-</p>
          </div>
          <div class="resource-row">
            <span id="goldText">&#37329;&#24065; 0</span>
            <span id="powerText">&#25112;&#21147; 0</span>
          </div>
        </header>

        <section class="layout">
          <aside class="sidebar">
            <section class="panel">
              <h2>&#35282;&#33394;</h2>
              <div id="statsView" class="stat-grid"></div>
            </section>

            <section class="panel">
              <h2>&#22320;&#22270;</h2>
              <div id="mapList" class="button-list"></div>
            </section>
          </aside>

          <section class="center">
            <section class="panel combat-panel">
              <div class="panel-title-row">
                <h2>&#25112;&#26007;</h2>
                <span id="currentMapText">-</span>
              </div>
              <div id="combatStatus" class="combat-status">&#20934;&#22791;&#20013;</div>
              <div id="monsterView" class="monster-view"></div>
            </section>

            <section class="panel">
              <h2>&#25112;&#26007;&#26085;&#24535;</h2>
              <div id="logView" class="log-view"></div>
            </section>
          </section>

          <aside class="sidebar">
            <section class="panel">
              <h2>&#35013;&#22791;</h2>
              <div id="equipmentView" class="equipment-view"></div>
            </section>

            <section class="panel">
              <h2>&#32972;&#21253;</h2>
              <div id="inventoryView" class="inventory-view"></div>
            </section>
          </aside>
        </section>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
    <script>
      window.setTimeout(function () {
        if (!window.__simpleAfkReady) {
          var warning = document.querySelector("#moduleWarning");
          if (warning) warning.classList.remove("hidden");
        }
      }, 1200);
    </script>
  </body>
</html>
